name: clicknow_version2
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.1+6

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  get_storage: ^2.1.1
  firebase_core: ^4.5.0
  firebase_app_check: ^0.4.1+2
  firebase_auth: ^6.2.0
  firebase_auth_platform_interface: ^8.1.7
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.0.1
  firebase_storage: ^13.0.1
  smooth_page_indicator: ^1.2.1
  sms_autofill: ^2.5.0
  smart_auth: ^3.2.0
  share_plus: ^12.0.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  file_picker: ^10.3.10
  multi_dropdown: ^3.1.1
  syncfusion_flutter_charts: ^32.2.9
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  video_thumbnail: ^0.5.6
  video_player: ^2.10.0
  youtube_player_iframe: ^5.2.2
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.5.0
  razorpay_flutter: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/avtars/
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/auth/
    - assets/images/banner/
    - assets/images/services/
    - assets/images/vendor/
    - assets/images/welcome/
    - assets/images/clicknow_logo.jpeg
    - assets/icon/icon.png
